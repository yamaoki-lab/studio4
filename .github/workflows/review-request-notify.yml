name: Google Chat へのレビュー依頼通知

on:
  pull_request:
    types: [review_requested, ready_for_review]

jobs:
  notify:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # ready_for_review 時に PR の timeline を取得するため
    permissions:
      issues: read
      pull-requests: read
    steps:
      - name: 対象確認 + Google Chat への通知
        env:
          GCHAT_WEBHOOK_URL: ${{ secrets.GCHAT_WEBHOOK_URL }}
          GCHAT_SENSEI_ID: ${{ secrets.GCHAT_SENSEI_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REQUESTER: ${{ github.event.pull_request.user.login }}
          REQUESTER_AVATAR: ${{ github.event.pull_request.user.avatar_url }}
          REPO_NAME: ${{ github.event.repository.name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          ADDITIONS: ${{ github.event.pull_request.additions }}
          DELETIONS: ${{ github.event.pull_request.deletions }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          LABELS_JSON: ${{ toJSON(github.event.pull_request.labels) }}
          EVENT_ACTION: ${{ github.event.action }}
          REQUESTED_REVIEWER: ${{ github.event.requested_reviewer.login }}
          REQUESTED_TEAM: ${{ github.event.requested_team.slug }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # timeline を取得できなかった際に, 暗黙的にスキップせず明示的に失敗させる
          set -o pipefail

          # 先生 (個人の yamaokilab) または admin チームへのレビュー依頼の場合のみ通知する.
          # 1つの依頼につき通知は1回のみとする (ready への変更に伴う CODEOWNERS の依頼で
          # ready_for_review と review_requested が同時に発生しても, 重複して送信しない)
          case "$EVENT_ACTION" in
            review_requested)
              # このイベントで新しく依頼された相手のみを対象とする. PR の "現在待っている相手" の
              # 全体を参照すると, 後で別のレビュワーを追加した際にも先生へ通知してしまう
              if [ "$REQUESTED_REVIEWER" = "yamaokilab" ] || [ "$REQUESTED_TEAM" = "admin" ]; then
                IS_TARGET=true
              else
                IS_TARGET=false
              fi
              ;;
            ready_for_review)
              # draft 中の依頼は通知をスキップしているため, ready への変更時に検知する.
              # ready と同時に CODEOWNERS が依頼した分は review_requested 側で送信されるため,
              # ready より前 (draft へ戻したことがあれば, その後) の依頼で, 解除されずに
              # 残っている依頼のみを対象とする
              IS_TARGET=$(gh api "repos/$GH_REPO/issues/$PR_NUMBER/timeline" --paginate --jq '.[]' | jq -s '
                (map(select(.event == "ready_for_review")) | last | .created_at) as $ready
                | (map(select(.event == "convert_to_draft" and .created_at < $ready)) | last | .created_at // "") as $draft
                | map(select(
                    (.event == "review_requested" or .event == "review_request_removed")
                    and .created_at > $draft and .created_at < $ready
                    and ((.requested_reviewer.login // "") == "yamaokilab" or (.requested_team.slug // "") == "admin")))
                | (last | .event) == "review_requested"')
              ;;
            *)
              IS_TARGET=false
              ;;
          esac

          if [ "$IS_TARGET" != "true" ]; then
            echo "先生 (個人または admin チーム) への新しいレビュー依頼ではないのでスキップします"
            exit 0
          fi

          curl -sf -X POST "$GCHAT_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg sensei "$GCHAT_SENSEI_ID" \
              --arg number "$PR_NUMBER" \
              --arg requester "$REQUESTER" \
              --arg avatar "$REQUESTER_AVATAR" \
              --arg title "$PR_TITLE" \
              --arg url "$PR_URL" \
              --arg repo "$REPO_NAME" \
              --arg headRef "$HEAD_REF" \
              --arg baseRef "$BASE_REF" \
              --arg diffstat "+${ADDITIONS} -${DELETIONS} (${CHANGED_FILES} ファイル)" \
              --argjson labels "$LABELS_JSON" \
              '
              def labelChips: if ($labels | length) > 0
                then [{ chipList: { chips: ($labels | map({ label: .name })) } }]
                else [] end;
              {
                text: "<\($sensei)> [\($repo)] \($requester)さんからレビュー依頼です",
                cardsV2: [{
                  cardId: "review-request",
                  card: {
                    header: { title: "#\($number) \($title)", subtitle: $repo, imageUrl: $avatar, imageType: "CIRCLE" },
                    sections: [{
                      widgets: (
                        [
                          { decoratedText: { startIcon: { knownIcon: "PERSON" }, topLabel: "作成者", text: $requester } },
                          { decoratedText: { text: "\($headRef) → \($baseRef)" } },
                          { decoratedText: { text: $diffstat } }
                        ] + labelChips + [
                          { buttonList: { buttons: [{ text: "PRを開く", onClick: { openLink: { url: $url } } }] } }
                        ]
                      )
                    }]
                  }
                }]
              }')"
